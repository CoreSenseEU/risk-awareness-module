# RiskAM configuration
#
# Edit this file to tune RiskAM for your deployment environment.
# All parameters can also be overridden at launch time via ROS 2 argument syntax.

/riskam_node:
  ros__parameters:
    # ── Camera topics ─────────────────────────────────────────────────────────
    camera_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/depth/image_rect_raw"
    cmd_vel_topic: "/cmd_vel"

    # ── Risk weights (must sum to 1.0) ────────────────────────────────────────
    # w_approach weights the T2.2 approach sub-score (0.5 = stationary,
    # >0.5 = approaching, <0.5 = moving away). Default 0.0 until the T3.3
    # evaluation sweep produces a calibrated value.
    w_proximity: 0.7
    w_gaze: 0.25
    w_position: 0.05
    w_approach: 0.0

    # ── Proximity / depth ─────────────────────────────────────────────────────
    # Safety distance in metres. Persons at or beyond d_safe score 0 on proximity.
    d_safe: 1.5
    # Sensor near-clip dead-zone (T2.7). Defaults below preserve RealSense
    # behaviour exactly. Set ``depth_near_clip_m`` > 0 only when your sensor
    # has a hard near-clip (e.g. PrimeSense Xtion / Carmine: ~0.6 m); RiskAM
    # will then treat "all-zero depth in a person-sized bbox" as "person too
    # close to measure" → max proximity, instead of the legacy "nothing
    # there → score 0" semantic that inverts the safety direction on those
    # sensors. See docs/sensors-and-platforms.md.
    depth_near_clip_m: 0.0
    # Minimum bbox area as a fraction of the full frame for the close-fallback
    # to fire. Ignored when ``depth_near_clip_m == 0``.
    near_clip_bbox_min_frac: 0.05
    # Maximum valid-pixel fraction within a bbox for the close-fallback to
    # fire. ``0.0`` (default) means strictly zero valid pixels — RealSense
    # behaviour. Set to a small positive value (e.g. ~0.05 for Xtion) to also
    # fire on "mostly empty" bboxes whose few valid pixels are likely
    # background bleed-through, not the person.
    near_clip_valid_frac_max: 0.0

    # ── Gaze (2-D head pose) ──────────────────────────────────────────────────
    # Gaussian σ for yaw deviation (normalised by inter-eye distance).
    gaze_sigma_yaw: 0.3
    # Gaussian σ for pitch deviation from the expected frontal nose-eye ratio.
    gaze_sigma_pitch: 0.5
    # Expected (nose.y − eye_mid.y) / inter_eye_dist for a frontal face.
    gaze_frontal_pitch_ratio: 0.7

    # ── Temporal aggregation ──────────────────────────────────────────────────
    n_frames_aggregate: 5
    # Crowd penalty coefficient α: scene_risk *= (1 + α·log(1 + n_extra))
    crowd_alpha: 0.1

    # ── Visualisation ─────────────────────────────────────────────────────────
    visualize_image: true

    # ── Synchroniser slop (seconds) ───────────────────────────────────────────
    sync_slop: 0.1

    # ── Kinematic companion channel ───────────────────────────────────────────
    # The awareness-modulated kinematic formulation (riskam/kinematics.py)
    # runs alongside the weighted score on the same primitives and publishes
    # on /riskam/risk_kinematic. The weighted scoring path is unaffected.
    publish_kinematic: true
    # Camera intrinsics source: leave empty to use the camera_info sibling of
    # camera_topic; set camera_hfov_deg > 0 to use a pinhole fallback instead
    # (e.g. 69.0 for RealSense D4xx, 58.0 for PrimeSense Xtion).
    camera_info_topic: ""
    camera_hfov_deg: 0.0
    # Physical referents: reaction window (s), oblivious-human penalty, and
    # robot footprint radius (m); d_safe is shared with the proximity score.
    kinematic_tau_s: 2.0
    kinematic_beta: 1.0
    footprint_radius_m: 0.0

/riskam_bagger:
  ros__parameters:
    # ── Output file ───────────────────────────────────────────────────────────
    bag_folder: "bags"
    bag_name: "riskam_test"
    tag_with_time: true

    # ── Topics to record ──────────────────────────────────────────────────────
    log_images: true
    log_annotated_images: true
    log_subscores: true

    # ── Topic names (must match riskam_node and your camera remappings) ───────
    topic_camera_image: "/camera/camera/color/image_raw"
    topic_annotated_image: "/riskam/annotated_image"
    topic_risk_score: "/riskam/risk_score"
    topic_gaze: "/riskam/gaze"
    topic_depth: "/riskam/depth"
    topic_x_pose: "/riskam/x_pose"
    topic_approach: "/riskam/approach"

# ── Example RealSense camera parameters ──────────────────────────────────────
# Uncomment and adjust if you launch the camera node from this config:
#
# /camera/camera:
#   ros__parameters:
#     enable_depth: true
#     enable_color: true
#     rgb_camera.color_profile: "640x480x15"
#     depth_module.depth_profile: "640x480x15"
